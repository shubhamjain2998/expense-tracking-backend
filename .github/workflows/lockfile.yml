name: Update lockfiles

# Manually-triggered workflow that regenerates requirements.txt and
# requirements-dev.txt on Linux Python 3.11 — the same platform CI uses to
# install them — and commits the result to a branch that can be opened as a
# PR.
#
# Background: the maintainer's local venv is Python 3.9 on macOS, where pip
# cannot see Py3.10+-only transitive constraints (filelock>=3.24.2 from
# virtualenv 21.x, greenlet from sqlalchemy on Linux, …). Running pip-compile
# in CI removes the platform drift.
#
# Usage:
#   gh workflow run "Update lockfiles" --ref <your branch>
# or via the Actions tab → Run workflow.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to commit the regenerated lockfiles to"
        required: false
        default: "chore/update-lockfiles"

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

      - name: Recompile production lockfile
        run: |
          pip-compile --generate-hashes --strip-extras \
            requirements.in -o requirements.txt

      - name: Recompile dev lockfile
        run: |
          pip-compile --generate-hashes --strip-extras --allow-unsafe \
            requirements-dev.in -o requirements-dev.txt

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ inputs.target_branch }}
          commit-message: "chore: regenerate lockfiles on Linux Py3.11"
          title: "chore: regenerate lockfiles on Linux Py3.11"
          body: |
            Auto-generated by `.github/workflows/lockfile.yml`.

            Both `requirements.txt` and `requirements-dev.txt` were recompiled
            from their `.in` sources on Linux Python 3.11 (the same platform
            CI installs them on), avoiding the cross-platform constraint
            drift that hits `pip-compile` runs from macOS Python 3.9.

            Review the diff, then merge.
          delete-branch: true
