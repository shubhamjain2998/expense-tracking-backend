name: Update lockfiles

# Manually-triggered workflow that regenerates requirements.txt and
# requirements-dev.txt on Linux Python 3.11 — the same platform CI uses to
# install them — and commits the result back to the branch it was triggered
# from.
#
# Background: the maintainer's local venv is Python 3.9 on macOS, where pip
# cannot see Py3.10+-only conditional constraints (e.g. virtualenv's
# `filelock>=3.24.2; python_version >= "3.10"`, or SQLAlchemy's optional
# greenlet dependency on Linux). Running pip-compile here removes the drift.
#
# Usage:
#   gh workflow run "Update lockfiles" --ref <branch>
# or via the Actions tab → Run workflow → pick the branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The PAT-less default token can't push to a protected branch, but
          # branch protection is not yet enabled on main — see roadmap.
          # `fetch-depth: 0` keeps history so a follow-up amend is possible.
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

      - name: Recompile production lockfile
        run: |
          pip-compile --generate-hashes --strip-extras \
            requirements.in -o requirements.txt

      - name: Recompile dev lockfile
        run: |
          pip-compile --generate-hashes --strip-extras --allow-unsafe \
            requirements-dev.in -o requirements-dev.txt

      - name: Commit + push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt requirements-dev.txt
          if git diff --cached --quiet; then
            echo "::notice::Lockfiles already up to date — nothing to commit."
          else
            git commit -m "chore: regenerate lockfiles on Linux Py3.11

          Auto-generated by .github/workflows/lockfile.yml. Both
          requirements.txt and requirements-dev.txt were recompiled from
          their .in sources on Linux Python 3.11 (the same platform CI
          installs them on), avoiding the cross-platform constraint drift
          that hits pip-compile runs from macOS Python 3.9."
            git push
          fi
