name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel an in-progress run when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, scan (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

      - name: Sync dev environment
        run: pip-sync requirements-dev.txt

      - name: Format check (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      - name: Test with coverage
        env:
          # Tests stub these via os.environ.setdefault, but providing them here
          # makes failures explicit instead of silently using whatever was set.
          DATABASE_URL: "sqlite:///:memory:"
          SUPABASE_JWT_SECRET: "ci-placeholder-secret-not-used-in-prod"
        run: pytest --cov=app --cov-report=term --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14

      - name: Security scan — source (bandit)
        run: bandit -c pyproject.toml -r app

      # pip-audit currently surfaces pre-existing vulnerabilities in pinned deps
      # (starlette, cryptography, pillow, …). Keep this step non-blocking until
      # those are addressed in a dedicated dependency-upgrade PR; the findings
      # still show up in the workflow logs.
      - name: Security scan — dependencies (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt --strict
