repos:
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # Configuration in .flake8

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "app"]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false

  # Validates the commit message format (run on `git commit`, not on file
  # changes). Devs must `pre-commit install --hook-type commit-msg` once
  # locally for this to fire — `pre-commit install` alone only installs
  # the pre-commit hook, not the commit-msg hook.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.7.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
